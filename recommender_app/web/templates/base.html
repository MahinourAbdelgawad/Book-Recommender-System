<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Book Recommender</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='library.css') }}">
  <script defer src="{{ url_for('static', filename='covers.js') }}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="{{ url_for('home') }}">Book Recommender</a>
    <nav aria-label="Main navigation">
      {% if session.get('user_id') %}
        <a href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('library') }}"{% if request.endpoint in ('library', 'imports.index') %} aria-current="page"{% endif %}>My Library</a>
        <a href="{{ url_for('recommendations') }}"{% if request.endpoint == 'recommendations' %} aria-current="page"{% endif %}>Recommendations</a>
        <form action="{{ url_for('auth.logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Sign in</a>
        <a href="{{ url_for('auth.signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="shell" id="main">
  {% block heading %}{% endblock %}
  {% for message in get_flashed_messages() %}
    <p class="notice" role="status">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
